version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    # depends_on: # Not needed for SQLite
      # - db
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile # Assuming you will create this Dockerfile for frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
